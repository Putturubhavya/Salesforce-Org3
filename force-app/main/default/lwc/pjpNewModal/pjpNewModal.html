<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open slds-modal_medium">
        <div class="slds-modal__container">
            <!-- Header -->
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCancel}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">New Permanent Journey Plan</h2>
            </header>

            <!-- Body -->
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                <lightning-record-edit-form
                    object-api-name="Permanent_Journey_Plan__c"
                    onsubmit={handleSubmit}
                    onsuccess={handleSuccess}
                    onerror={handleError}>
                    
                    <lightning-messages></lightning-messages>

                    <div class="slds-text-body_small slds-m-bottom_small required-legend">
                        <span class="slds-text-color_error">*</span> = Required Information
                    </div>

                    <div class="slds-section-title--divider slds-m-bottom_small section-header">
                        Information
                    </div>

                    <div class="slds-grid slds-gutters slds-wrap">
                        <!-- Left Column -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input-field field-name="Name" required></lightning-input-field>
                            <lightning-input-field field-name="Employee__c" value={employeeId} required></lightning-input-field>
                            <lightning-input-field field-name="Beat__c" value={beatId} onchange={handleBeatChange} required></lightning-input-field>
                            <lightning-input-field field-name="Status__c"></lightning-input-field>
                            <lightning-input-field field-name="Plan_Date__c"></lightning-input-field>
                        </div>

                        <!-- Right Column -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input-field field-name="Approval_Status__c"></lightning-input-field>
                            <lightning-input-field field-name="Approved_Date__c"></lightning-input-field>
                            <lightning-input-field field-name="Approval_Rejection_Reason__c"></lightning-input-field>
                            <lightning-input-field field-name="Total_Planned_Outlets__c"></lightning-input-field>
                            <lightning-input-field field-name="OwnerId"></lightning-input-field>
                        </div>
                    </div>
                </lightning-record-edit-form>
            </div>

            <!-- Footer -->
            <footer class="slds-modal__footer">
                <lightning-button label="Cancel" onclick={handleCancel} class="slds-m-right_x-small"></lightning-button>
                <lightning-button label="Save & New" onclick={handleSaveAndNew} class="slds-m-right_x-small"></lightning-button>
                <lightning-button variant="brand" label="Save" onclick={handleSave} disabled={isSaving}></lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
